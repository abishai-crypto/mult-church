services:
  - type: web
    name: mult-church-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "EAGT Golani - Kimara Suka"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: "base64:z6UD+5SymhkfLyrMqyBfQKN3dO6miSpuL78Tn9Jmk9c="
      - key: APP_URL
        value: "https://mult-church-web.onrender.com"
      - key: ASSET_URL
        value: "https://mult-church-web.onrender.com"
      - key: FORCE_HTTPS
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: mult-church-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "4320"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: mult-church-db
    plan: free
    region: frankfurt
    databaseName: mult_church
    user: church_admin
